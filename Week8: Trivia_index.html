<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                let buttons = document.querySelectorAll('.choice');
                buttons.forEach(function(button) {
                    button.addEventListener('click', function() {
                        if (button.textContent === 'China') {
                            button.style.backgroundColor = 'green';
                            document.querySelector('#feedback1').textContent = 'Correct!';
                        } else {
                            button.style.backgroundColor = 'red';
                            document.querySelector('#feedback1').textContent = 'Incorrect';
                        }
                    });
                });

                document.querySelector('#check').addEventListener('click', function() {
                    let answer = document.querySelector('#answer').value.trim();
                    if (answer === 'China') {
                        document.querySelector('#answer').style.backgroundColor = 'green';
                        document.querySelector('#feedback2').textContent = 'Correct!';
                    } else {
                        document.querySelector('#answer').style.backgroundColor = 'red';
                        document.querySelector('#feedback2').textContent = 'Incorrect';
                    }
                });
            });
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <p>Where is Tian'anmen Square located</p>

                <button class="choice">China</button>
                <button class="choice">United States</button>
                <button class="choice">United Kingdom</button>

                <p id="feedback1"></p>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <p>Which country has a rad flag with five stars?</p>

                <input id="answer" type="text">
                <button id="check">Check Answer</button>

                <p id="feedback2"></p>
            </div>
        </div>
    </body>
</html>
